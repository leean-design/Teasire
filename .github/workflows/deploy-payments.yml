# Deploys the Billplz payments worker (Teasire-codebase/worker) to Cloudflare.
# Run it from the Actions tab: "Deploy payments worker" → Run workflow.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token, "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Cloudflare dashboard
#   BILLPLZ_API_KEY        Billplz → Settings → Keys & Integration → API Secret Key
#   BILLPLZ_X_SIGNATURE    Billplz → Settings → Keys & Integration → X Signature Key
#   ADMIN_TOKEN            any long random password, for listing orders at /orders
name: Deploy payments worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payments-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Teasire-codebase/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check secrets are set
        env:
          BILLPLZ_API_KEY: ${{ secrets.BILLPLZ_API_KEY }}
          BILLPLZ_X_SIGNATURE: ${{ secrets.BILLPLZ_X_SIGNATURE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BILLPLZ_API_KEY BILLPLZ_X_SIGNATURE ADMIN_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing"
            exit 1
          fi

      - name: Run tests
        run: node --test

      # Use the order store if it exists, otherwise create it, and put its id in wrangler.toml.
      - name: Find or create the order store
        run: |
          title=teasire-orders
          id=$($WRANGLER kv namespace list | sed -n "/^\[/,\$p" | jq -r --arg t "$title" '.[] | select(.title == $t) | .id')
          if [ -z "$id" ]; then
            $WRANGLER kv namespace create "$title"
            id=$($WRANGLER kv namespace list | sed -n "/^\[/,\$p" | jq -r --arg t "$title" '.[] | select(.title == $t) | .id')
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the KV namespace"; exit 1; }
          printf '\n[[kv_namespaces]]\nbinding = "ORDERS"\nid = "%s"\n' "$id" >> wrangler.toml

      - name: Deploy
        run: $WRANGLER deploy | tee deploy.log

      - name: Set secrets
        env:
          BILLPLZ_API_KEY: ${{ secrets.BILLPLZ_API_KEY }}
          BILLPLZ_X_SIGNATURE: ${{ secrets.BILLPLZ_X_SIGNATURE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for name in BILLPLZ_API_KEY BILLPLZ_X_SIGNATURE ADMIN_TOKEN; do
            printf '%s' "${!name}" | $WRANGLER secret put "$name"
          done

      - name: Show the worker address
        run: |
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker address: $url"
          echo "### Payments worker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Put this in \`apiUrl\` in \`Teasire-codebase/dist/config/payments.json\`: **$url**" >> "$GITHUB_STEP_SUMMARY"
