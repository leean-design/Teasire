# Teasire payments: creates Billplz bills for the bag and records paid orders.
# Setup steps are in ../README.md under "Online payments (Billplz)".
name = "teasire-payments"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# The published website. Prices are read from its config/prices.json, customers
# come back to its checkout page after paying, and only it may call this worker.
SITE_URL = "https://leean-design.github.io/Teasire"
# Sandbox while testing. For real payments: "https://www.billplz.com"
BILLPLZ_API = "https://www.billplz-sandbox.com"
# Your Billplz collection ID (Billplz → Billing → Collections). Not secret.
BILLPLZ_COLLECTION_ID = "ukys0roj"
# Who order emails come from (see "Order emails" in ../README.md). The address
# must be on a domain verified in your Resend account. Not secret.
ORDER_EMAIL_FROM = "Teasire <peiwen@scircle.online>"

# Every order is kept in a KV namespace bound as ORDERS. The deploy workflow
# adds the section below itself. To deploy from your own computer, run
#   npx wrangler@4 kv namespace create teasire-orders
# then uncomment these lines and paste the id it prints:
# [[kv_namespaces]]
# binding = "ORDERS"
# id = ""

# Secrets, set with `npx wrangler secret put <NAME>` (never commit them):
#   BILLPLZ_API_KEY      Billplz → Settings → Keys & Integration → API Secret Key
#   BILLPLZ_X_SIGNATURE  Billplz → Settings → Keys & Integration → X Signature Key
#   ADMIN_TOKEN          any long random string; lets you list orders at /orders
#   RESEND_API_KEY       optional: Resend → API Keys. Order emails stay off without it.
